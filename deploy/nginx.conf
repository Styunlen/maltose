# Maltose — Nginx reverse proxy (ADR-0033) — recommended config
#
# The Astro SSR server runs under pm2 (standalone mode, default port 8080,
# override via PORT). pm2 cluster workers share one port, so nginx proxies to
# a single upstream port and Node distributes internally.
#
# IMPORTANT: static assets (dist/client) are served by the Astro Node server
# itself (serve-static), so nginx does NOT need to know the deploy directory.
# This keeps the proxy independent of PRODUCTION_PATH/STAGING_PATH. If you want
# nginx to serve static files directly instead, see the commented block below.
#
# Place in /etc/nginx/sites-available/maltose and symlink into sites-enabled.
# Adjust server_name and upstream port.

# ── Node upstream (pm2, shared port) ─────────────────────────────────────────
upstream maltose {
    server 127.0.0.1:8080;   # matches pm2 PORT env (or ecosystem.config.cjs)
    keepalive 32;            # reuse upstream connections
}

server {
    listen 80;
    server_name styunlen.cn www.styunlen.cn;

    # ── TLS (recommended: let's encrypt) ────────────────────────────────────
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/styunlen.cn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/styunlen.cn/privkey.pem;
    # http2 on;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP only if your content has no inline/remote violations:
    # add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; script-src 'self';" always;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/woff2;

    # ── Everything → Astro SSR (which also serves dist/client static) ──────
    location / {
        proxy_pass http://maltose;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;     # no-op unless WebSocket used
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_buffering off;                        # keep SSR responses streaming
    }

    # ── Large uploads (comment images etc.) ─────────────────────────────────
    client_max_body_size 20m;
}

# ── Optional: nginx serves static directly (higher perf, requires deploy dir) ──
# Add this block ONLY if you want nginx to bypass Node for static assets.
# It hardcodes the client dir — update when PRODUCTION_PATH changes.
