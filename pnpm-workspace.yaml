allowBuilds:
  '@parcel/watcher': false
  bcrypt: true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  sharp: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.10.1'
  - '@astrojs/markdown-satteri@0.3.3'
  - '@astrojs/node@11.0.2'
  - '@astrojs/react@6.0.1'
  - '@astrojs/ts-plugin@1.10.10'
  - astro@7.0.6
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - bcrypt
  - esbuild
  - sharp
  - vue-demi
